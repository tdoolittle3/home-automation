# Lockup forensics (snibbly freeze investigation, 2026-10-21 — see the
# hard-freeze history in docs/snibbly.md and the kdump notes below).
#
# The box hard-froze repeatedly leaving zero evidence: journal stops mid-write,
# pstore empty, no panic. These make the NMI watchdog escalate a hard lockup to
# a panic, which (with kdump loaded — USE_KDUMP=1 in /etc/default/kdump-tools)
# writes a vmcore to /var/crash and then reboots 30 s later instead of hanging
# until someone walks over and presses the power button.
kernel.hardlockup_panic = 1
kernel.panic = 30
