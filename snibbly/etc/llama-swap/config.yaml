healthCheckTimeout: 300
startPort: 5800
apiKeys:
  - "${env.LLAMA_API_KEY}"

# GPU 1 (1050 Ti, 4 GB) is reserved for the vision pipeline — no LLM may claim
# it. The 4B models that used to live there were removed 2026-10-20; agent-runner
# now delegates to the second slot of its 8B instead (-np 2). The one exception:
# big-14b still borrows ~1.1 GB of GPU 1 via its 7/1 split, which coexists with
# the ~2 GB vision working set but leaves no headroom — if vision OOMs while
# big-14b is loaded, this split is the first suspect.
models:
  "fast-8b":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/Qwen3-8B-Q4_K_M.gguf -ngl 99 -t 4 -c 16384 -np 2 --jinja
    env: ["CUDA_VISIBLE_DEVICES=0"]
    ttl: 0
  # The scheduled-jobs engine (Hermes `cron.model`): same 30B-A3B weights as
  # coder-30b but the Thinking tune — slower, stronger multi-step analysis,
  # which is the right trade for unattended cron scans. Full MoE offload
  # (--n-cpu-moe 48) like coder-30b so the 64k KV cache an agent loop needs
  # fits on GPU 0.
  "big-30b-thinking":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/Qwen3-30B-A3B-Thinking-2507-Q4_K_M.gguf -ngl 99 --n-cpu-moe 48
      -t 4 -c 65536 -ctk q8_0 -ctv q8_0 -fa on -np 1 --jinja
    env: ["CUDA_VISIBLE_DEVICES=0"]
    ttl: 0
  "big-14b":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/Qwen3-14B-Q4_K_M.gguf -ngl 99 -ts 7/1 -t 4 -c 8192 -ctk q8_0 -ctv q8_0 -fa on -np 1 --jinja
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID"]
    ttl: 0
  "8b-abliterated":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/qwen3-8b-abliterated.Q4_K_M.gguf -ngl 99 -t 4 -c 8192 -np 2 --jinja
    env: ["CUDA_VISIBLE_DEVICES=0"]
    ttl: 0
  # The agent engine for the Hermes harness. All experts offloaded to RAM
  # (--n-cpu-moe 48 = every layer) so the 2070S's 8 GB is free to hold a 64k KV
  # cache at q8 — the context floor Hermes needs for multi-step tool loops.
  # Stays on GPU 0 only (no tensor-split); experts live in system RAM, not GPU 1.
  "coder-30b":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf -ngl 99 --n-cpu-moe 48
      -t 4 -c 65536 -ctk q8_0 -ctv q8_0 -fa on -np 1 --jinja
    env: ["CUDA_VISIBLE_DEVICES=0"]
    ttl: 0

  # Vision captions for the camera archive (snibbly/vision/captioner.py). No -ngl:
  # --fit sizes the GPU layers to whatever VRAM is free when it loads — ~2.2 GB
  # beside a resident coder-30b, ~8-13 s per caption — so it never needs the agent
  # model evicted. Its group is non-exclusive: it never unloads anyone, while any
  # request to an exclusive-group model — even one already loaded, verified
  # 2026-11-12 — unloads it. So Hermes never waits on it; the captioner just
  # reloads it (~10-14 s from page cache) after agent activity. Safe by
  # construction: fast-8b/big-14b, which need the whole GPU, always win.
  # ttl frees the VRAM when captions go idle.
  "vlm-8b":
    cmd: |
      /opt/llama.cpp/build-cuda/bin/llama-server --port ${PORT} --host 127.0.0.1
      -m /opt/models/Qwen3-VL-8B-Instruct-Q4_K_M.gguf
      --mmproj /opt/models/Qwen3-VL-8B-mmproj-F16.gguf
      --fit on -t 4 -c 8192 -np 1 --image-max-tokens 1024 --jinja
    env: ["CUDA_VISIBLE_DEVICES=0"]
    ttl: 300

routing:
  router:
    use: group
    settings:
      groups:
        "dual":
          swap: false
          exclusive: true
          members: ["fast-8b"]
        "big":
          swap: true
          exclusive: true
          members: ["coder-30b", "big-30b-thinking", "big-14b"]
        "ablit":
          swap: false
          exclusive: true
          members: ["8b-abliterated"]
        "vlm":
          swap: false
          exclusive: false
          members: ["vlm-8b"]
