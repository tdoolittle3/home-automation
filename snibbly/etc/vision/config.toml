# Vision pipeline worker — tracked at snibbly/etc/vision/config.toml, deployed
# to /etc/vision/config.toml. The worker reads it once at startup: restart the
# vision-worker service after editing. Omitted keys fall back to the defaults
# in vision_worker.py.

[frigate]
base_url = "http://192.168.0.13:5000"   # unauthenticated Frigate API — LAN only
cameras = ["driveway", "backyard"]      # swept cameras; MQTT events are taken from any camera

[mqtt]
host = "192.168.0.13"
port = 1883
topic = "frigate/events"

[http]
bind = "0.0.0.0"                        # health/status JSON for Kuma and humans
port = 8098

[storage]
data_dir = "/opt/vision/data"
event_frames_retain_days = 30
sweep_frames_retain_days = 7

[events]
fps = 2.0             # event clips are short — decode fully at 2 fps
clip_wait_secs = 15   # Frigate finalizes the clip shortly after the event ends

[sweep]
enabled = true
chunk_minutes = 20    # one job = one chunk of continuous recording, streamed to ffmpeg
lag_minutes = 10      # stay this far behind "now" so recordings have settled
start_offset_hours = 6   # on first ever run, begin sweeping this far back (retention is 2 days)

[analyze]
conf_threshold = 0.40          # YOLO detections below this are ignored outright
sweep_keep_threshold = 0.50    # a sweep frame survives if any detection scores >= this
entity_match_threshold = 0.85  # CLIP cosine to join an existing entity; below founds a new one
sweep_event_gap_secs = 90      # kept sweep frames closer than this cluster into one event
batch_size = 16                # YOLO batch; fp32 on the 4 GB card, keep modest
static_presence = 0.5          # same label+box in >= this share of a batch's frames = scenery
                               # (parked car, grill-as-suitcase) -> suppressed, no events/entities
