[Service]
# --any: ready when EITHER nic is up. eno2 satisfies this the day it gets a
# cable; until then wlo1 satisfies it in ~15 s instead of a guaranteed 120 s
# timeout that held user logins hostage (pam_nologin) on every boot — a fresh
# boot was indistinguishable from a frozen box, which fed the power-cycle loop
# during the 2026-10-21 freeze investigation.
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any -i eno2:degraded -i wlo1:routable
