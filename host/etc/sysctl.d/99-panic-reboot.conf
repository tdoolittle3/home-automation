# Reboot instead of hanging after a kernel panic.
# 2026-09-06: an MCE-broadcast panic left the box frozen with LEDs on for 26 min
# until it was power-cycled by hand. The crash record was already saved to EFI
# pstore before the hang, so hanging buys nothing - reboot and let the
# containers (all restart: unless-stopped) come back on their own.
kernel.panic = 10
# Treat a hard CPU lockup the same way - it would otherwise hang identically.
kernel.hardlockup_panic = 1
