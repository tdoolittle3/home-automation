# upsmon is the piece that saves the filesystem: when the UPS reports low
# battery (OB + LB), it shuts the host down cleanly instead of letting the
# battery die mid-write. Alerting is ups-guard.sh's job, not this file's.
# Same __NUT_MON_PASSWORD__ as upsd.users - the install step seds both.
MONITOR cyberpower@localhost 1 monmaster __NUT_MON_PASSWORD__ master

SHUTDOWNCMD "/sbin/shutdown -h +0"
POWERDOWNFLAG /etc/killpower
