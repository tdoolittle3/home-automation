# Hold tailscaled until the DHCP lease installs a default route (max 30s, never
# fails). network-online.target is useless here: enp44s0 is allow-hotplug, so
# it fires ~9s before the lease and tailscaled starts with no route to control.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do ip route show default | grep -q . && exit 0; sleep 1; done; exit 0'
