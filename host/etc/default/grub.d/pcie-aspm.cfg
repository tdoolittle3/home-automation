# Disable PCIe Active State Power Management.
# 2026-09-06: the camera-side Intel I226-V (igc, enp45s0) hit a transmit-queue
# watchdog reset, followed 7 s later by a fatal machine check. I226-V TX hangs
# are a known ASPM/low-power-link pattern. This is a plugged-in server, so the
# power saving is worth nothing here. Sourced by grub-mkconfig after
# /etc/default/grub; takes effect after `update-grub` + reboot.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT pcie_aspm=off"
