# Keep the kernel's DVB-T television driver off the RTL-SDR dongle.
#
# The RTL2832U chip in an RTL-SDR Blog V3 is, as far as the kernel is
# concerned, a TV tuner. Without this, dvb_usb_rtl28xxu binds it at plug-in
# and librtlsdr (readsb, rtl_test, rtl_tcp) then fails with
# "usb_claim_interface error -6" / "Device or resource busy".
#
# blacklist alone is not enough — these get pulled in as dependencies of each
# other rather than by alias, so each is also aliased to /bin/false.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2838
blacklist dvb_usb_v2
blacklist e4000
blacklist fc0012
blacklist fc0013
blacklist r820t

install dvb_usb_rtl28xxu /bin/false
install rtl2832 /bin/false
install rtl2830 /bin/false
