---
# rebuild.md step 10 — install only. The forwarding sysctl ships with the
# host_files role. Joining the tailnet stays manual (interactive auth):
#   tailscale up --advertise-routes=192.168.0.0/24 --accept-routes
# then approve the subnet route in the admin console, and re-apply
# `tailscale serve` for the dashboard's https front per docs/stt.md.

# Upstream's documented install path is the pipe-to-sh script, kept as-is.
- name: tailscale (install script)  # noqa: command-instead-of-module
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
    executable: /bin/bash

- name: tailscaled enabled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# Boot race: enp44s0 is allow-hotplug DHCP, so network-online.target fires
# ~9s before the lease and tailscaled starts routeless ("logged out" until it
# retries ~17s in). Self-heals; this just waits for the default route first.
- name: tailscaled drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: "0755"

- name: tailscaled waits for a default route
  ansible.builtin.copy:
    src: "{{ repo_root }}/host/etc/systemd/system/tailscaled.service.d/10-wait-default-route.conf"
    dest: /etc/systemd/system/tailscaled.service.d/10-wait-default-route.conf
    mode: "0644"
  notify: systemd daemon-reload
