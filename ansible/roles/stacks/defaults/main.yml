---
stacks_root: /opt/stacks

# Synced as whole directories. frigate and home are handled by their own
# tasks (seed config / restart-on-change rules); see tasks/main.yml.
stacks_whole_dirs: [media, immich, net, n8n, stt, mesh, dash, sdr, dns, vaultwarden, radiolog, hermes, ntfy]

# `docker compose up -d` runs for these every play — idempotent, a no-op for
# unchanged services. Deliberately absent:
#   sdr  — needs one-time host prep + a real lat/long .env (docs/sdr.md)
#   dns  — the one stack that can take the whole house offline (docs/dns.md)
#   dash — image is built from the home-dashboard clone, not pulled
#          (docs/operations.md -> Dashboard)
#   mesh — its only service sits behind profiles: ["cli"]; `up` has nothing
#          to start and exits "no service selected"
#   radiolog — image is built in-place from the synced dir; `up` without
#          `--build` would run a stale image after source changes
#          (docs/radiolog.md)
#   hermes — image is built from the hermes-agent clone, and the gateway
#          can't start before data/.env secrets exist on the box; auto-up
#          on a fresh rebuild would fail the whole play (docs/hermes.md)
stacks_auto_up: [frigate, home, media, immich, net, n8n, stt, vaultwarden, ntfy]

# Executed by systemd units as root; systemd refuses a non-root-owned
# disk-guard.sh, and the other root-run guards follow the same rule.
stacks_root_scripts:
  - disk-guard.sh
  - ups-guard.sh
  - frigate-guard.sh
  - kuma-watchdog.sh
  - vaultwarden-backup.sh
  - vault-render.sh

# Run as the admin user (iptv-playlist.service has User=thomas;
# kuma-provision.py is invoked by hand), so they keep that ownership.
stacks_admin_scripts:
  - iptv-playlist.py
  - kuma-provision.py
  - vault-seed-build.py
  - tv-fleet.py          # tv-fleet-*.service run User=thomas (adb key)
