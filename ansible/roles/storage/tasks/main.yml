---
# rebuild.md step 4 — directory layout. Deliberately NOT recursive ownership:
# on the live box /opt/stacks/net holds root-owned guard scripts and the data
# dirs hold container-owned files; a recursive chown here would break them.

- name: /srv/storage layout
  ansible.builtin.file:
    path: "/srv/storage/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
  loop: [frigate, media, photos, files, archive]

# The stack list lives in roles/stacks/defaults (stacks_whole_dirs) — one
# source of truth, so a stack added there gets its admin-owned dir here too.
# frigate and home are synced by dedicated tasks in that role, hence the
# explicit extras. Role defaults are play-scoped, so this resolves even
# though storage runs before stacks in ladybird.yml.
- name: /opt/stacks layout
  ansible.builtin.file:
    path: "/opt/stacks/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
  loop: "{{ stacks_whole_dirs + ['frigate', 'home'] }}"
