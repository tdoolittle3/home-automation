# Immich off-box backup settings for ladybird (immich-backup.sh).
# Edit these, no restart needed - the timer re-reads on every run.

# UPLOAD_LOCATION from stacks/immich/.env. Immich's own nightly database dumps
# land in its backups/ subdirectory.
PHOTOS_DIR=/srv/storage/photos

# Immich's Database Backup job runs at 02:00; anything older than this means
# the job stopped, and the backup fails (Kuma pages) instead of shipping stale.
MAX_DUMP_AGE_HOURS=26

# Off-box destination, rsync-over-ssh. Lands on snibbly under
# ~thomas/backups/immich/ ({upload,library,profile}/ + db/). Reuses root@ladybird's
# key that vaultwarden-backup already has authorized there (docs/vaultwarden.md).
REMOTE_DEST=thomas@192.168.0.19:backups/immich/
