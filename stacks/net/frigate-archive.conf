# Frigate full-footage archive settings for ladybird (frigate-archive.sh).
# Edit these, no restart needed - the timer re-reads on every run.

# Where Frigate writes recordings on the host (<UTC date>/<UTC hour>/<camera>/).
RECORDINGS_DIR=/srv/storage/frigate/recordings

# An hour directory is copied once it is this old, and for WINDOW hours after.
# Frigate thins an hour to motion-only at 24 h (record.continuous.days: 1), so
# 24 - ARCHIVE_AFTER_HOURS is how long snibbly can be unreachable before full
# footage is lost. Lower = more cushion, but more of snibbly's disk holding
# hours that ladybird still has in full.
ARCHIVE_AFTER_HOURS=18
ARCHIVE_WINDOW_HOURS=8

# Copies on snibbly are deleted at this age: 72 = three days of full footage in
# total. At ~120 GB/day for three cameras (measured 2026-11-27) snibbly holds
# (72 - 18) h = ~270 GB. Raising this by a day costs snibbly another ~120 GB.
KEEP_HOURS=72

# Do not copy when snibbly has less than this free - its disk also carries the
# models and the vision archive.
MIN_REMOTE_FREE_GB=60

# rsync-over-ssh destination. Reuses root@ladybird's key that the Vaultwarden
# and Immich backups already have authorized on snibbly (docs/vaultwarden.md).
REMOTE_HOST=thomas@192.168.0.19
REMOTE_DIR=backups/frigate-recordings
