# Frigate guard settings for ladybird.
# Re-read on every run - edits need no restart.

API=http://127.0.0.1:5000
REC_ROOT=/srv/storage/frigate/recordings

# Fail if no recording segment has been written this recently (minutes).
# Frigate writes segments continuously; 5 minutes is a safe floor.
MAX_AGE_MIN=5

# Treat object detection being off as a failure.
# Set to 0 only if you deliberately run motion-only recording.
REQUIRE_DETECTION=1

# Auto-restart the container if the API is unreachable this many runs in a row
# (runs are every 2 min). Covers "running but wedged", which Docker ignores.
# Camera/stream failures never trigger a restart. Set AUTO_RESTART=0 to disable.
AUTO_RESTART=1
RESTART_AFTER=3
# Never restart more than once per this many minutes (prevents a restart loop).
RESTART_COOLDOWN_MIN=30
