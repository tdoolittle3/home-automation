# Frigate guard settings for ladybird.
# Re-read on every run - edits need no restart.

API=http://127.0.0.1:5000
REC_ROOT=/srv/storage/frigate/recordings

# Fail if no recording segment has been written this recently (minutes).
# Frigate writes segments continuously; 5 minutes is a safe floor.
MAX_AGE_MIN=5

# Treat object detection being off as a failure.
# Set to 0 only if you deliberately run motion-only recording.
REQUIRE_DETECTION=1
