# Vaultwarden backup settings for ladybird.
# Edit these, no restart needed - the timer re-reads on every run.

# The live vault (bind mount from stacks/vaultwarden) and where snapshots land.
DATA_DIR=/opt/stacks/vaultwarden/vw-data
BACKUP_DIR=/srv/storage/backups/vaultwarden

# Local retention. Snapshots are small (the db is megabytes), so a month
# of nightlies costs little and covers "I deleted that entry weeks ago".
KEEP_DAYS=30

# Off-box destination in rsync-over-ssh syntax. Snapshots land on snibbly
# under ~thomas/backups/vaultwarden/ so the vault backup survives ladybird's
# disk. Needs root@ladybird's key authorized on the target and rsync on both
# ends (base role installs it here) - one-time setup in docs/vaultwarden.md.
# Empty = local snapshots only.
REMOTE_DEST=thomas@192.168.0.19:backups/vaultwarden/
