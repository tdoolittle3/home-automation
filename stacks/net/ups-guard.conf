# UPS guard thresholds for ladybird.
# Edit these, no restart needed - the timer re-reads on every run.

UPS_NAME=cyberpower    # the [section] name in /etc/nut/ups.conf

# Degraded-but-protected thresholds. Breaching these turns on the HA problem
# sensor and annotates the Kuma beat, but does not page - only critical states
# (on battery, low battery, failed battery, unreachable UPS) push Kuma down.
CHARGE_WARN_PCT=80     # charge stuck below this on line power = battery not recovering
RUNTIME_WARN_MIN=10    # a charged battery predicting less than this = battery is aging out
