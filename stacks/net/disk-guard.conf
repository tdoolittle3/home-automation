# Storage guard thresholds for ladybird.
# Edit these, no restart needed - the timer re-reads on every run.

STORAGE_ROOT=/srv/storage

# Filesystem-level thresholds
WARN_PCT=75           # warn when the disk is this full (%)
CRIT_PCT=85           # critical when the disk is this full (%)
MIN_FREE_GB=40        # critical if free space drops below this (recordings floor)

# Soft caps per data set - breaching these raises a warning, nothing is deleted
FRIGATE_CAP_GB=200    # expected ceiling for 2d continuous + 14d alerts, 1-2 cameras
MEDIA_CAP_GB=150      # Jellyfin library allocation
