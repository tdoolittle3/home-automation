- id: door_open_5min_ntfy
  alias: Door left open 5 minutes
  description: ntfy alert when an exterior door has been open 5 minutes straight,
    then a reminder every 10 minutes until it closes, then an all-clear when it
    closes. Each door runs its own copy (mode parallel); closing re-arms it.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.sun_room_sliding_glass_door
    to: 'on'
    for:
      minutes: 5
  actions:
  - variables:
      door: '{{ trigger.entity_id }}'
      door_name: '{{ trigger.to_state.name }}'
  - action: rest_command.ntfy_alert
    data:
      title: Door left open
      message: '{{ door_name }} has been open for 5 minutes.'
      priority: high
      tags: door
  - repeat:
      sequence:
      - wait_template: '{{ is_state(door, ''off'') }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ is_state(door, ''on'') }}'
        then:
        - action: rest_command.ntfy_alert
          data:
            title: Door still open
            message: '{{ door_name }} has been open for {{ 5 + 10 * repeat.index
              }} minutes.'
            priority: high
            tags: door
      until:
      - condition: template
        value_template: '{{ is_state(door, ''off'') }}'
  - action: rest_command.ntfy_alert
    data:
      title: Door closed
      message: '{{ door_name }} is now closed (was open {{ ((now() - trigger.to_state.last_changed).total_seconds()
        / 60) | round }} minutes).'
      priority: default
      tags: door,white_check_mark
  mode: parallel
- id: door_open_overnight_ntfy
  alias: Door open overnight
  description: Between midnight and 5:30 AM an open exterior door alerts immediately
    and then every 2 minutes until every door is closed or the window ends. The
    midnight trigger catches a door already open when the window starts. Mode
    restart so a second door opening mid-loop alerts right away; each alert lists
    every door currently open.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.sun_room_sliding_glass_door
    to: 'on'
  - trigger: time
    at: '00:00:00'
  conditions:
  - condition: time
    after: '00:00:00'
    before: '05:30:00'
  actions:
  - variables:
      doors:
      - binary_sensor.living_room_front_door
      - binary_sensor.sun_room_sliding_glass_door
  - repeat:
      while:
      - condition: template
        value_template: '{{ expand(doors) | selectattr(''state'', ''eq'', ''on'')
          | list | count > 0 }}'
      - condition: time
        after: '00:00:00'
        before: '05:30:00'
      sequence:
      - action: rest_command.ntfy_alert
        data:
          title: Door open overnight
          message: '{{ expand(doors) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'')
            | join('' and '') }} open at {{ now().strftime(''%H:%M'') }}.'
          priority: urgent
          tags: door,new_moon
      - wait_template: '{{ expand(doors) | selectattr(''state'', ''eq'', ''on'')
          | list | count == 0 }}'
        timeout:
          minutes: 2
        continue_on_timeout: true
  mode: restart
- id: person_overnight_ntfy
  alias: Person detected overnight
  description: ntfy alert when Frigate sees a person on either camera between
    22:00 and 07:00. Each detection alerts once (occupancy going on); mode
    parallel so both cameras can alert independently.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.driveway_person_occupancy
    - binary_sensor.backyard_person_occupancy
    to: 'on'
  conditions:
  - condition: time
    after: '22:00:00'
    before: '07:00:00'
  actions:
  - action: rest_command.ntfy_alert
    data:
      title: Person detected overnight
      message: 'Person on the {{ trigger.entity_id.split(''.'')[1].replace(''_person_occupancy'',
        '''') }} camera at {{ now().strftime(''%H:%M'') }}.'
      priority: urgent
      tags: bust_in_silhouette,camera
  mode: parallel
- id: garage_open_overnight_ntfy
  alias: Garage door open overnight
  description: Between 21:00 and 09:00 the garage door alerts the moment it opens,
    reminds every 10 minutes while open, and sends an all-clear the moment it
    closes. The 21:00 time trigger catches a door already open when the window
    starts; past 09:00 the loop stops and the daytime automation takes over, so
    no close alert is sent then. Mode restart re-arms cleanly on reopen.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_door
    to: 'on'
  - trigger: time
    at: '21:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_door
    state: 'on'
  - condition: time
    after: '21:00:00'
    before: '09:00:00'
  actions:
  - variables:
      opened_at: '{{ states.binary_sensor.garage_door.last_changed.isoformat() }}'
  - action: rest_command.ntfy_alert
    data:
      title: Garage door open overnight
      message: Garage door open at {{ now().strftime('%H:%M') }}.
      priority: urgent
      tags: door,new_moon
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.garage_door
        state: 'on'
      - condition: time
        after: '21:00:00'
        before: '09:00:00'
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.garage_door'', ''off'') }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door
          state: 'on'
        then:
        - action: rest_command.ntfy_alert
          data:
            title: Garage door still open
            message: Garage door has been open for {{ ((now() - as_datetime(opened_at)).total_seconds()
              / 60) | round }} minutes.
            priority: urgent
            tags: door,new_moon
  - if:
    - condition: state
      entity_id: binary_sensor.garage_door
      state: 'off'
    then:
    - action: rest_command.ntfy_alert
      data:
        title: Garage door closed
        message: Garage door is now closed (was open {{ ((now() - as_datetime(opened_at)).total_seconds()
          / 60) | round }} minutes).
        priority: default
        tags: door,white_check_mark
  mode: restart
- id: garage_open_daytime_ntfy
  alias: Garage door left open daytime
  description: Between 09:00 and 21:00 the garage door alerts only after being
    open 20 minutes straight, reminds every 20 minutes while open, and sends an
    all-clear when it closes. The 09:00 time trigger picks up a door still open
    from the overnight window; past 21:00 the loop stops and the overnight
    automation takes over, so no close alert is sent then. Mode restart re-arms
    the 20-minute timer on reopen.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_door
    to: 'on'
    for:
      minutes: 20
  - trigger: time
    at: '09:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_door
    state: 'on'
  - condition: time
    after: '09:00:00'
    before: '21:00:00'
  actions:
  - variables:
      opened_at: '{{ states.binary_sensor.garage_door.last_changed.isoformat() }}'
  - action: rest_command.ntfy_alert
    data:
      title: Garage door left open
      message: Garage door has been open for {{ ((now() - as_datetime(opened_at)).total_seconds()
        / 60) | round }} minutes.
      priority: high
      tags: door
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.garage_door
        state: 'on'
      - condition: time
        after: '09:00:00'
        before: '21:00:00'
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.garage_door'', ''off'') }}'
        timeout:
          minutes: 20
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door
          state: 'on'
        then:
        - action: rest_command.ntfy_alert
          data:
            title: Garage door still open
            message: Garage door has been open for {{ ((now() - as_datetime(opened_at)).total_seconds()
              / 60) | round }} minutes.
            priority: high
            tags: door
  - if:
    - condition: state
      entity_id: binary_sensor.garage_door
      state: 'off'
    then:
    - action: rest_command.ntfy_alert
      data:
        title: Garage door closed
        message: Garage door is now closed (was open {{ ((now() - as_datetime(opened_at)).total_seconds()
          / 60) | round }} minutes).
        priority: default
        tags: door,white_check_mark
  mode: restart
- id: water_leak_ntfy
  alias: Water leak alert
  description: ntfy alert the moment the sink moisture detector reports water.
    DISABLED 2026-10-29 by request - initial_state keeps it off across restarts;
    revert that line to re-arm. The sensor stays paired and stays in the Zigbee
    offline/network-down watchdogs below.
  initial_state: false
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.sink_moisture_detector
    to: 'on'
  actions:
  - action: rest_command.ntfy_alert
    data:
      title: WATER LEAK
      message: '{{ trigger.to_state.name }} is detecting water!'
      priority: urgent
      tags: rotating_light,droplet
  mode: parallel
- id: zigbee_sensor_offline_ntfy
  alias: Zigbee sensor offline
  description: ntfy alert when a Zigbee sensor has been unavailable for 30 minutes,
    a reminder every 6 hours while it stays offline, and an all-clear when it
    reports again. ZHA only marks a silent battery device unavailable after its
    ~6 hour consider-unavailable window, so this fires roughly 6.5 hours after
    the sensor actually stopped talking; the 30-minute hold absorbs the brief
    unavailable flap of an HA restart. Suppressed when ALL sensors are gone -
    that is a coordinator problem and "Zigbee network down" owns it. Each sensor
    runs its own copy (mode parallel).
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.sun_room_sliding_glass_door
    - binary_sensor.sink_moisture_detector
    - binary_sensor.garage_door
    to: unavailable
    for:
      minutes: 30
  conditions:
  - condition: template
    value_template: '{{ expand([''binary_sensor.living_room_front_door'', ''binary_sensor.sun_room_sliding_glass_door'',
      ''binary_sensor.sink_moisture_detector'', ''binary_sensor.garage_door'']) |
      selectattr(''state'', ''eq'', ''unavailable'') | list | count < 4 }}'
  actions:
  - variables:
      sensor: '{{ trigger.entity_id }}'
      sensor_name: '{{ trigger.to_state.name }}'
  - action: rest_command.ntfy_alert
    data:
      title: Zigbee sensor offline
      message: '{{ sensor_name }} has stopped reporting - check its battery and placement.'
      priority: high
      tags: warning,battery
  - repeat:
      sequence:
      - wait_template: '{{ states(sensor) != ''unavailable'' }}'
        timeout:
          hours: 6
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ states(sensor) == ''unavailable'' }}'
        then:
        - action: rest_command.ntfy_alert
          data:
            title: Zigbee sensor still offline
            message: '{{ sensor_name }} has been offline for {{ ((now() - trigger.to_state.last_changed).total_seconds()
              / 3600) | round(1) }} hours.'
            priority: high
            tags: warning,battery
      until:
      - condition: template
        value_template: '{{ states(sensor) != ''unavailable'' }}'
  - action: rest_command.ntfy_alert
    data:
      title: Zigbee sensor back online
      message: '{{ sensor_name }} is reporting again (was offline {{ ((now() - trigger.to_state.last_changed).total_seconds()
        / 3600) | round(1) }} hours).'
      priority: default
      tags: white_check_mark
  mode: parallel
- id: zigbee_down_ntfy
  alias: Zigbee network down
  description: Urgent ntfy when ALL Zigbee sensors are unavailable for 15 minutes
    straight - the signature of a dead coordinator dongle rather than one bad
    sensor - then a reminder every 30 minutes and an all-clear when any sensor
    reports again. Door, garage and water-leak alerting is blind while this is
    firing. Lag caveat - ZHA marks silent battery devices unavailable only after
    ~6 hours, so a dead dongle can take that long to surface here.
  triggers:
  - trigger: template
    value_template: '{{ expand([''binary_sensor.living_room_front_door'', ''binary_sensor.sun_room_sliding_glass_door'',
      ''binary_sensor.sink_moisture_detector'', ''binary_sensor.garage_door'']) |
      selectattr(''state'', ''eq'', ''unavailable'') | list | count == 4 }}'
    for:
      minutes: 15
  actions:
  - variables:
      sensors:
      - binary_sensor.living_room_front_door
      - binary_sensor.sun_room_sliding_glass_door
      - binary_sensor.sink_moisture_detector
      - binary_sensor.garage_door
  - action: rest_command.ntfy_alert
    data:
      title: Zigbee network down
      message: All Zigbee sensors are unavailable - likely the coordinator dongle.
        Door, garage and water-leak alerts are blind.
      priority: urgent
      tags: rotating_light,signal_strength
  - repeat:
      sequence:
      - wait_template: '{{ expand(sensors) | selectattr(''state'', ''eq'', ''unavailable'')
          | list | count < 4 }}'
        timeout:
          minutes: 30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ expand(sensors) | selectattr(''state'', ''eq'', ''unavailable'')
            | list | count == 4 }}'
        then:
        - action: rest_command.ntfy_alert
          data:
            title: Zigbee network still down
            message: All Zigbee sensors still unavailable at {{ now().strftime('%H:%M')
              }}.
            priority: urgent
            tags: rotating_light,signal_strength
      until:
      - condition: template
        value_template: '{{ expand(sensors) | selectattr(''state'', ''eq'', ''unavailable'')
          | list | count < 4 }}'
  - action: rest_command.ntfy_alert
    data:
      title: Zigbee network recovered
      message: '{{ expand(sensors) | rejectattr(''state'', ''eq'', ''unavailable'')
        | list | count }} of 4 Zigbee sensors reporting again.'
      priority: default
      tags: white_check_mark
  mode: restart
