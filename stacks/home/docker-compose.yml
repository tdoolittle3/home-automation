services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    ports:
      - "1883:1883"
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    devices:
      # Sonoff Zigbee Dongle Plus MG24 — by-id so the RTL-SDR can't steal ttyUSB0 on reboot
      - /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_003d5c1c0d8cf01183c624b9d9065118-if00-port0:/dev/ttyUSB0
    depends_on: [mosquitto]
