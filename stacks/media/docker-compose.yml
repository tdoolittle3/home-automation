services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    restart: unless-stopped
    user: 1000:1000
    group_add:
      - "992"          # render group GID
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/storage/media:/media:ro
    ports:
      - "8096:8096"

  # XMLTV guide data for the IPTV tuner. iptv-org publishes no ready-made EPG
  # files - this is their grabber, scraping only the channels in epg/channels.xml.
  epg:
    container_name: epg
    image: ghcr.io/iptv-org/epg:master@sha256:600adccd4254ad3c1ca049fe43879a0ad124d9bebf5ffaa27ac7198d5a7cbaa2
    restart: unless-stopped
    volumes:
      - ./epg/channels.xml:/epg/public/channels.xml:ro
    ports:
      - "3000:3000"
