services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: 1000:1000
    group_add:
      - "992"          # render group GID
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/storage/media:/media:ro
    ports:
      - "8096:8096"

  # XMLTV guide data for the IPTV tuner. iptv-org publishes no ready-made EPG
  # files - this is their grabber, scraping only the channels in epg/channels.xml.
  epg:
    container_name: epg
    image: ghcr.io/iptv-org/epg:master
    restart: unless-stopped
    volumes:
      - ./epg/channels.xml:/epg/public/channels.xml:ro
    ports:
      - "3000:3000"
