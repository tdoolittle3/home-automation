# Hermes Agent — the "Operator" homelab agent harness (docs/hermes.md).
#
# The agent LOOP and tool execution run HERE on ladybird; model inference runs
# on snibbly (litellm :8080 -> llama-swap -> coder-30b). This container is
# CPU/RAM-light — no GPU, no model weights, just the orchestration loop.
#
# Ansible-synced since 2026-11-08 (stacks_whole_dirs — compose, examples and
# skills/ flow with every converge; the gitignored data/ dir survives, copy
# never deletes). Deliberately NOT in stacks_auto_up: the image is built
# locally (below) and the gateway can't start before data/.env exists, so
# restarts after a compose change stay manual — `docker compose up -d` here.
# First-ever run has extra steps: docs/hermes.md.
#
# Image is BUILT from upstream (NousResearch/hermes-agent), not a registry pull.
# Build once on ladybird:
#   git clone https://github.com/NousResearch/hermes-agent ~/src/hermes-agent
#   (cd ~/src/hermes-agent && docker build -t hermes-agent:latest .)
#
# Secrets (litellm key, HA token, Telegram token) live in ./data/.env
# (gitignored), NEVER in this file.
services:
  gateway:
    image: hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    # Host networking so the agent can reach HA (192.168.0.13:8123), snibbly
    # litellm (192.168.0.19:8080), and the Telegram gateway can poll out.
    # No `ports:` — incompatible with host mode.
    network_mode: host
    volumes:
      # config.yaml + .env + persistent memory/skills/logs. Gitignored.
      - ./data:/opt/data
      # Radio logs (Meshtastic chat, ISM sensor decodes, ADS-B sightings) —
      # written by stacks/radiolog, read-only here so the agent's file tools
      # can query them but never alter them. The radio-logs skill
      # (./skills/homelab/radio-logs) documents the schemas.
      - /opt/stacks/radiolog/data:/opt/data/workspace/radiolog:ro
      # Frigate incident bundles (container state + redacted frigate/nginx/go2rtc
      # log tails) written by net/frigate-guard.sh when it auto-restarts a wedged
      # Frigate. Read-only: Hermes diagnoses, the guard (not the agent) restarts.
      # See skills/homelab/frigate-incidents.
      - /var/lib/frigate-incidents:/opt/data/workspace/frigate-incidents:ro
      # Generated reports/dashboards land here (agent's file tool writes to
      # /opt/data/reports); the `reports` nginx service below serves this same
      # dir. Kept OUT of ./data so the web server never exposes .env/config.yaml.
      - ./reports:/opt/data/reports
      # terminal.backend: docker — Hermes uses this socket to spawn the ephemeral
      # sandbox container that the agent's code runs INSIDE. The agent's own code
      # does not get the socket; only the Hermes orchestrator does. This is
      # root-equivalent on ladybird — accepted for this trusted, reprovisionable
      # homelab. (Safer alternative: terminal.backend: ssh — docs/hermes.md.)
      - /var/run/docker.sock:/var/run/docker.sock
    # docker.sock is root:docker (gid 989 on ladybird); add that gid so the
    # in-container hermes user can reach the socket to spawn sandboxes.
    group_add:
      - "989"
    # Load the whole .env into the container environment so plugins that read
    # os.environ (e.g. the Home Assistant plugin's HASS_TOKEN/HASS_URL) see it,
    # not just the core model client that parses .env itself.
    env_file:
      - ./data/.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ./data:/opt/data
    # Same .env as the gateway — the dashboard reads HERMES_DASHBOARD_PUBLIC_URL
    # (so it trusts the tailscale-serve hostname) and HERMES_DASHBOARD_BASIC_AUTH_*
    # (the login a public URL requires) from here.
    env_file:
      - ./data/.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    # Binds 127.0.0.1; reached over the tailnet via `tailscale serve` (:9119).
    # A non-loopback public_url engages the basic-auth gate — see .env.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  reports:
    # Permanent static-file server for agent-generated reports/dashboards. The
    # agent writes HTML into ./reports (mounted at /opt/data/reports in the
    # gateway via its file tool); this serves that same dir, read-only. Fronted
    # on the tailnet by `tailscale serve --https=9123` (tailnet-only — the ntfy
    # link it sends is useless to anyone not on the tailnet). Static files only,
    # no secrets, no GPU.
    image: nginx:alpine
    container_name: hermes-reports
    restart: unless-stopped
    ports:
      - "127.0.0.1:9123:80"
    volumes:
      - ./reports:/usr/share/nginx/html:ro
