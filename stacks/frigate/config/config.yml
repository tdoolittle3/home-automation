mqtt:
  enabled: true
  host: 192.168.0.13
  port: 1883
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
detectors:
  ov:
    type: openvino
    device: GPU
ffmpeg:
  hwaccel_args: preset-vaapi
# ---- Object detection ----
# Frigate 0.17 defaults detect.enabled to FALSE. Without this block the cameras
# stream and record fine but the detector never runs: no events, no alerts, and
# the alerts/detections tiers below retain nothing.
# Set globally, not per-camera, so cameras added later inherit it rather than
# silently defaulting back off.
detect:
  enabled: true
# ---- go2rtc restreams ----
# Frigate pulls each camera stream once through go2rtc; the UI live view, the
# dashboard's HLS proxy, and the detect/record roles all read from these.
# driveway_sub is the camera's third stream (subtype=2), the only sub-stream on
# the T54PRO-ZE that goes above D1. The T24IR has no sub stream 2, so
# backyard_sub is sub stream 1 (subtype=1, 704x480).
go2rtc:
  streams:
    driveway:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.201:554/cam/realmonitor?channel=1&subtype=0
    driveway_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.201:554/cam/realmonitor?channel=1&subtype=2
    backyard:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.202:554/cam/realmonitor?channel=1&subtype=0
    backyard_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.202:554/cam/realmonitor?channel=1&subtype=1
# ---- Tiered retention ----
# Tier 1: full footage, short window
# Tier 2: motion/event clips, medium window
# Tier 3: snapshots, long window (tiny files)
record:
  enabled: true
  alerts:
    retain:
      days: 10
      mode: motion
  detections:
    retain:
      days: 7
      mode: motion
  continuous:
    days: 2
  motion:
    days: 2
snapshots:
  enabled: true
  retain:
    default: 60
    objects:
      person: 180
      car: 90
objects:
  track: [person, car, dog, cat]
cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [record]
      output_args:
        record: preset-record-generic-audio-copy
    detect:
      width: 1280
      height: 720
      fps: 5
    # The camera's burned-in timestamp ticks every second and reads as
    # perpetual motion, keeping the detector busy on an otherwise idle scene.
    motion:
      mask:
        - 0.66,0,1,0,1,0.09,0.66,0.09
    # Everything from the sidewalk down to the house. The street runs across
    # the top of the frame: ~105 passing cars/day were each becoming an
    # "alert" (measured 2026-11-01..07: 732 of 933 weekly events were
    # driveway cars, half under 3s). Zone membership is judged by the
    # bottom-center of the box, so street traffic stays out while anything
    # pulling into or walking up the driveway enters.
    zones:
      front_yard:
        coordinates: 0,0.45,0.35,0.36,0.75,0.36,1,0.44,1,1,0,1
    # Street passes still record under the detections tier (7d); only
    # activity on the property is an alert (10d tier + review UI).
    review:
      alerts:
        required_zones: [front_yard]
    live:
      streams:
        Main 4MP: driveway
        Sub 720p: driveway_sub
  backyard:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/backyard_sub
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/backyard
          input_args: preset-rtsp-restream
          roles: [record]
    detect:
      width: 704
      height: 480
      fps: 5
    # Masks: burned-in timestamp (top right) and "IPC" logo (bottom left) —
    # both register as constant motion on a scene that is otherwise still.
    motion:
      mask:
        - 0.62,0,1,0,1,0.11,0.62,0.11
        - 0,0.87,0.1,0.87,0.1,1,0,1
    live:
      streams:
        Main 2MP: backyard
        Sub 480p: backyard_sub
version: 0.17-0
