mqtt:
  enabled: true
  host: 192.168.0.13
  port: 1883
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
detectors:
  ov:
    type: openvino
    device: GPU
ffmpeg:
  hwaccel_args: preset-vaapi
# ---- Object detection ----
# Frigate 0.17 defaults detect.enabled to FALSE. Without this block the cameras
# stream and record fine but the detector never runs: no events, no alerts, and
# the alerts/detections tiers below retain nothing.
# Set globally, not per-camera, so cameras added later inherit it rather than
# silently defaulting back off.
detect:
  enabled: true
# ---- go2rtc restreams ----
# Frigate pulls each camera stream once through go2rtc; the UI live view and the
# detect/record roles all read from these. driveway_sub is the camera's third
# stream (subtype=2), the only sub-stream on the T54PRO-ZE that goes above D1.
go2rtc:
  streams:
    driveway:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.201:554/cam/realmonitor?channel=1&subtype=0
    driveway_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.201:554/cam/realmonitor?channel=1&subtype=2
# ---- Tiered retention ----
# Tier 1: full footage, short window
# Tier 2: motion/event clips, medium window
# Tier 3: snapshots, long window (tiny files)
record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 7
      mode: motion
  continuous:
    days: 2
  motion:
    days: 2
snapshots:
  enabled: true
  retain:
    default: 60
    objects:
      person: 180
      car: 90
objects:
  track: [person, car, dog, cat]
cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [record]
      output_args:
        record: preset-record-generic-audio-copy
    detect:
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Main 4MP: driveway
        Sub 720p: driveway_sub
  backyard:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.202:554/cam/realmonitor?channel=1&subtype=1
          roles: [detect]
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.10.202:554/cam/realmonitor?channel=1&subtype=0
          roles: [record]
    detect:
      width: 704
      height: 480
      fps: 5
version: 0.17-0
