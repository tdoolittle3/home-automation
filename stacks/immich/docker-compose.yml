# Immich — self-hosted photo and video library.
#
# Adapted from the official compose for the pinned release; check the upstream file
# before every version bump, since the database image and its extensions move with it:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Deviations from upstream, all deliberate:
#   - restart: unless-stopped (house style) rather than always, so a manual stop sticks.
#   - QuickSync transcoding inlined on immich-server instead of the hwaccel.transcoding.yml
#     `extends`, to keep this a single self-contained file.
#   - Machine learning stays on CPU. See the note on that service.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    # QuickSync — the same iGPU Frigate and Jellyfin use. Transcoding here is bursty
    # and short (uploaded videos only), so it coexists fine with Frigate's detector.
    # If /dev/dri is ever missing, drop this block and set the transcode policy to
    # software in the Immich admin UI; nothing else changes.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # UPLOAD_LOCATION is set in .env — do not hardcode a path here.
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # CPU inference, deliberately. The OpenVINO variant (image tag +"-openvino" plus the
    # device block from upstream's hwaccel.ml.yml) would share the iGPU with Frigate's
    # object detector, and the initial library import is a long saturating batch job.
    # Frigate is the workload that must not stall. Immich's own docs also warn that
    # integrated GPUs are more failure-prone and that OpenVINO raises memory use — this
    # host has 16 GB already carrying Frigate, HA, Jellyfin and the EPG grabber.
    # Revisit once the library is imported and steady-state, not before.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich_postgres
    # Pinned by digest upstream. This image carries the vector extensions Immich's
    # search depends on — never substitute a stock postgres image.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # DB_DATA_LOCATION is set in .env. It stays on the NVMe root, NOT under
      # /srv/storage — the Phase 2 drive swap remounts /srv/storage, and Postgres
      # must not be sitting on a filesystem that gets moved out from under it.
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  model-cache:
