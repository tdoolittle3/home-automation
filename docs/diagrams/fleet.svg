  <text x="630" y="828" class="label">Backyard camera</text><text x="630" y="852" class="mono">IPC-T24IR-AS · .202</text>
  <rect x="892" y="800" width="256" height="80" rx="12" class="card"/>
  <text x="910" y="828" class="label">Raspberry Pi 2</text><text x="910" y="852" class="small">Pi-hole standby · 192.168.0.14 · DNS rollback</text>

  <path d="M48 935h35" class="lan"/><text x="94" y="940" class="small">Ethernet LAN</text>
  <path d="M225 935h35" class="poe"/><text x="271" y="940" class="small">Camera segment</text>
