<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">The fleet — ladybird, snibbly, the radios and the camera segment</title>
  <desc id="desc">Logical overview of every machine the repository manages. The N600 router serves the home LAN, 192.168.0.0/24. Ladybird at 192.168.0.13 runs eleven Docker Compose stacks (Frigate, Home Assistant, Mosquitto, AdGuard Home serving LAN DNS, Jellyfin, Immich, n8n, Uptime Kuma, the dashboard, the EPG grabber, Whisper speech-to-text), host services including a Tailscale subnet router, and three radios: two RTL-SDR dongles for ADS-B and 433/315 MHz sensors, and a Zigbee coordinator for door, garage and leak sensors. Snibbly at 192.168.0.19 serves local LLMs: LiteLLM on 8080 is the door, tracing every conversation to Langfuse on 3000, and forwards to llama-swap on 9292 which runs llama.cpp backends on an RTX 2070 Super; a GTX 1050 Ti runs the camera vision worker on 8098. A Heltec V4 Meshtastic node at 192.168.0.16 gateways a private LoRa channel onto ladybird's Mosquitto. The camera segment, 10.10.10.0/24, has no gateway and cannot reach the internet; it carries the PoE switch, two cameras and the standby Raspberry Pi. Alerts leave the house via ntfy.sh; remote access is Tailscale only.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e34"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f7c66d"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#edf3fc}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#66dfcf}.title{font-size:38px;font-weight:700}.sub{font-size:16px;fill:#afbed3}.label{font-size:19px;font-weight:650}.body{font-size:15px;fill:#bfccdf}.mono{font:14px Consolas,monospace;fill:#bfccdf}.small{font-size:13px;fill:#afbed3}.card{fill:#17273e;stroke:#354963}.lan{fill:none;stroke:#8bbcff;stroke-width:3}.poe{fill:none;stroke:#66dfcf;stroke-width:3}.overlay{fill:none;stroke:#c4abff;stroke-width:3;stroke-dasharray:8 6}.flow{fill:none;stroke:#f7c66d;stroke-width:2.5;marker-end:url(#arr)}.teal{fill:#66dfcf}.blue{fill:#8bbcff}.amber{fill:#f7c66d}.violet{fill:#c4abff}</style>
  </defs>
  <rect width="1200" height="1000" rx="24" fill="url(#bg)"/>
  <text x="48" y="47" class="eyebrow">HOME LAB / SYSTEM ATLAS / 00</text>
  <text x="48" y="100" class="title">Two machines. Three radios. One house.</text>
  <text x="48" y="132" class="sub">ladybird runs the house · snibbly runs the models · logical overview — wiring and rack detail are in views 02–05</text>

