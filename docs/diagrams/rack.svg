<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
  <title id="title">Ladybird rack elevation and confirmed USB connection</title>
  <desc id="desc">Owner-confirmed eight-unit rack elevation. N600 modem router stands vertically on top. U8 Tecmojo shelf holds the TL-SG105MPE and a Raspberry Pi 2, a planned watchdog not yet configured. U7 contains a half-unit patch panel and half-unit gap. U6 through U4 are free. U3 GeeekPi passthrough shelf holds the Minisforum M1 Plus. U2 is an ElecVoztile PDU. U1 is the included shelf holding flat power bricks. CyberPower CP1000AVRLCDa sits on the floor and connects to the mini PC by USB. The UPS powers the PDU and directly powers the N600. All other powered rack equipment, including the Pi, plugs into the PDU. Equipment drawings, left-to-right placement and cable routes are schematic, not dimensionally accurate.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e34"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
    <pattern id="vent" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M2 0v6" stroke="#415069" stroke-width="2"/></pattern>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#edf3fc}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#66dfcf}.title{font-size:38px;font-weight:700}.sub{font-size:16px;fill:#afbed3}.label{font-size:20px;font-weight:650}.body{font-size:16px;fill:#bfccdf}.small{font-size:13px;fill:#afbed3}.unit{font:700 16px Consolas,monospace;fill:#8bbcff}.shelf{fill:#34435a;stroke:#64758d}.guide{stroke:#354963;stroke-dasharray:4 5}.leader{stroke:#607590;fill:none}.usb{stroke:#c4abff;stroke-width:3;fill:none}</style>
  </defs>
